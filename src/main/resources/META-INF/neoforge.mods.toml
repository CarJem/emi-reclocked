modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = ""

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[mixins]]
config = "emireclocked.mixins.json"

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neoforge_version_range}"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "CLIENT"

# We mixin directly into EMI's registry/reload classes, so EMI has to be present and loaded
# first. Client-only, matches EMI's and REMI's own dependency declarations.
[[dependencies.${mod_id}]]
    modId = "emi"
    type = "required"
    versionRange = "[1.1.24,)"
    ordering = "AFTER"
    side = "CLIENT"

# Soft dependency: REMI is not required to run this add-on (fixes #1-#3 only touch EMI's own
# classes), but this add-on is designed to sit alongside it.
[[dependencies.${mod_id}]]
    modId = "remi"
    type = "optional"
    versionRange = "[4.0.0,)"
    ordering = "AFTER"
    side = "CLIENT"
